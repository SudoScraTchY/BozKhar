# Keep the toolchain current without letting it move on its own.
#
# Two rules this repo learned the hard way on 2026-10-16: a Dependabot group
# is all-or-nothing, so one uninstallable update (typescript 7 against
# typescript-eslint 8's `typescript <6.1.0` peer range) fails `npm ci` for the
# entire batch - and once a red batch is merged, main itself is broken. So:
#   * a group carries minor and patch updates only, and
#   * majors arrive as their own pull request, one migration at a time, with
#     the decision log alongside: accepting a version here is a judgement,
#     not a chore.
# typescript majors stay ignored until typescript-eslint's peer range catches
# up - remove that entry then, not before.
#
# The cooldown keeps a freshly published version (the window a compromised
# release abuses) public for a week before it is even proposed.

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      npm-dev:
        patterns: ['*']
        update-types: ['minor', 'patch']
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
        update-types: ['minor', 'patch']
