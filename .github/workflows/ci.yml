# Continuous integration: every push to main and every pull request runs
# the same gates a release does.
#
# Supply-chain posture - this is the "secure" half of the pipeline:
#   * every action is pinned to a commit SHA, never a moving tag, so a
#     retagged action release cannot change what runs here;
#   * the workflow token is read-only unless a job asks for more, and
#     checkout does not persist its credentials, so no later step (or a
#     compromised dependency) can push with them;
#   * installs are `npm ci` only - package-lock.json is the resolution,
#     and a package.json/lockfile drift fails the job instead of quietly
#     resolving something newer;
#   * the build uses no secrets at all, so a fork's pull request runs the
#     identical pipeline;
#   * the artifact is audited against the agreed manifest, zipped, hashed
#     and - on pushes - attested with build provenance, so a user can
#     prove the zip came from this repository at this commit.
#
# NOT run here: e2e/e2e-settled-bill.py. It drives a pinned Playwright
# Chromium over a session IndexedDB dump, both local git-ignored artifacts
# under .openclaw/tmp/ - there is nothing for a runner to replay.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality (types, lint, format)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install (lockfile only)
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Runtime-dependency policy
        # D-15 / NFR-09: the extension ships with zero runtime dependencies.
        # If one is ever wanted, that is a decision-log entry, not a build
        # step - so the pipeline refuses until the question is answered.
        run: |
          set -euo pipefail
          declared="$(jq '(.dependencies // {}) | length' package.json)"
          if [ "$declared" != "0" ]; then
            jq '.dependencies' package.json
            echo "::error::BozKhar must ship with zero runtime dependencies (D-15/NFR-09)."
            exit 1
          fi

  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the floor package.json declares; 24 is what the build job
        # and the developer workspace use.
        node: ['22', '24']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install (lockfile only)
        run: npm ci
      - name: Test
        run: npm test

  build:
    name: build + package
    needs: [quality, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # signs the provenance attestation
      attestations: write # stores it
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install (lockfile only)
        run: npm ci
      - name: Read the version
        id: pkg
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"
      - name: Build
        run: npm run build
      - name: Audit the built manifest
        # NFR-06: permissions, host matches, version and manifest keys are
        # audited on the ARTIFACT, after the bundler has rewritten it.
        run: npm run audit:dist
      - name: Package the store zip
        # scripts/package-store-zip.py writes bozkhar-<version>.zip (the
        # stores want manifest.json at the archive root - the script
        # asserts that after writing) plus its .sha256 sidecar.
        run: python3 scripts/package-store-zip.py
      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: bozkhar-${{ steps.pkg.outputs.version }}.zip
      - name: Upload the installable package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bozkhar-${{ steps.pkg.outputs.version }}
          path: |
            bozkhar-${{ steps.pkg.outputs.version }}.zip
            bozkhar-${{ steps.pkg.outputs.version }}.zip.sha256
          if-no-files-found: error
          retention-days: 30
