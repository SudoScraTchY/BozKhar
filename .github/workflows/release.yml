# Release: publishes a GitHub Release carrying the store zip, its SHA-256 and a
# provenance attestation, built from the verified commit by the same gates CI
# runs - never from a workstation.
#
# Two ways in, both of which must name the version in package.json, so "what
# was reviewed" and "what was released" cannot drift apart:
#
#   1. push a tag - the usual path:
#        git tag -a v0.7.0 -m "BozKhar 0.7.0"
#        git push origin v0.7.0
#   2. Actions -> Release -> Run workflow, and type 0.7.0 (or v0.7.0). The tag
#      is created at the commit this run verified, on the default branch.
#
# Re-running for a tag that already exists is allowed only when that tag points
# at the very commit this run built - otherwise the release would carry
# artifacts built from a different tree.
#
# See agent/PUBLISHING.md for what to do with the zip afterwards.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Version to release, e.g. 0.7.0 or v0.7.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    name: verify, package, publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the tag and the release
      id-token: write # signs the provenance attestation
      attestations: write # stores it
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install (lockfile only)
        run: npm ci
      - name: Read the version
        id: pkg
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"
      - name: Resolve the requested tag
        id: tag
        env:
          REQUESTED: ${{ inputs.tag || github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          version="$(jq -r .version package.json)"
          tag="$REQUESTED"
          case "$tag" in v*) ;; *) tag="v$tag" ;; esac
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$REQUESTED' is not a version - expected the package.json version, e.g. 0.7.0 or v0.7.0"
            exit 1
          fi
          if [ "$tag" != "v$version" ]; then
            echo "::error::$tag does not match the version in package.json (v$version)"
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] &&
            [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "::error::a manual release is cut from $DEFAULT_BRANCH, not $GITHUB_REF_NAME"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag from $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "releasing $tag from $GITHUB_SHA"
      - name: Gate the release commit
        run: npm run verify
      - name: Build
        run: npm run build
      - name: Audit the built manifest
        run: npm run audit:dist
      - name: Build the Firefox bundle
        run: node scripts/build-firefox.mjs
      - name: Audit the Firefox manifest
        run: npm run audit:dist:firefox
      - name: Lint the Firefox bundle
        run: npm run lint:firefox
      - name: Package the store zip
        # scripts/package-store-zip.py writes bozkhar-<version>.zip (the
        # stores want manifest.json at the archive root - the script
        # asserts that after writing) plus its .sha256 sidecar.
        run: python3 scripts/package-store-zip.py
      - name: Package the Firefox zip
        run: python3 scripts/package-store-zip.py --dist dist-firefox --out bozkhar-firefox-${{ steps.pkg.outputs.version }}.zip
      - name: Package the AMO source zip
        # AMO reviewers rebuild minified bundles. git archive holds the
        # tracked build inputs at this commit; dist/ is gitignored and
        # package-lock.json is included so `npm ci` is reproducible.
        run: |
          set -euo pipefail
          source="bozkhar-${{ steps.pkg.outputs.version }}-source.zip"
          git archive --format=zip --prefix="bozkhar-${{ steps.pkg.outputs.version }}-source/" -o "$source" HEAD
          sha256sum "$source" > "$source.sha256"
      - name: Verify the package and add the stable alias
        # Three guards the release should never go out without:
        #  - each zip's OWN manifest must name the version being released,
        #    so package.json, the tag and the artifacts cannot drift apart;
        #  - bozkhar-latest.zip is the fixed name the landing page links to
        #    (releases/latest/download/bozkhar-latest.zip), so publishing a
        #    version is the only step that ever updates that download;
        #  - the Firefox zip stays versioned: it is unsigned until AMO
        #    signs the listing, so there is no stable install alias yet.
        run: |
          set -euo pipefail
          version="$(jq -r .version package.json)"
          zip="bozkhar-$version.zip"
          ff="bozkhar-firefox-$version.zip"
          packed="$(python3 -c 'import json,sys,zipfile;print(json.loads(zipfile.ZipFile(sys.argv[1]).read("manifest.json"))["version"])' "$zip")"
          packed_ff="$(python3 -c 'import json,sys,zipfile;print(json.loads(zipfile.ZipFile(sys.argv[1]).read("manifest.json"))["version"])' "$ff")"
          if [ "$packed" != "$version" ]; then
            echo "::error::$zip carries manifest version '$packed', not '$version'"
            exit 1
          fi
          if [ "$packed_ff" != "$version" ]; then
            echo "::error::$ff carries manifest version '$packed_ff', not '$version'"
            exit 1
          fi
          cp "$zip" bozkhar-latest.zip
          {
            echo "### BozKhar $version"
            echo
            echo 'The landing page downloads `bozkhar-latest.zip`; the attested file is `'"$zip"'`.'
            echo
            echo 'Firefox: `'"$ff"'` is unsigned for AMO submission. Stable Firefox installs come from the AMO listing; the zip is for review and temporary loading.'
            echo
            echo '```'
            cat "$zip.sha256"
            cat "$ff.sha256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # Chrome (versioned + stable alias), Firefox, and the AMO source
          # archive are attested, so every download verifies.
          subject-path: |
            bozkhar-${{ steps.pkg.outputs.version }}.zip
            bozkhar-latest.zip
            bozkhar-firefox-${{ steps.pkg.outputs.version }}.zip
            bozkhar-${{ steps.pkg.outputs.version }}-source.zip
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          version="$(jq -r .version package.json)"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::release $TAG already exists"
            exit 1
          fi

          # Peeling an annotated tag needs a second call: a tag ref points at
          # the tag object, not at the commit. The exit status decides whether
          # the tag exists - `gh api` writes its 404 body to stdout as well as
          # failing, so the text alone cannot be trusted.
          if existing="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" \
            --jq '"\(.object.type) \(.object.sha)"' 2>/dev/null)"; then
            sha="${existing##* }"
            if [ "${existing%% *}" = "tag" ]; then
              sha="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq .object.sha)"
            fi
            case "$sha" in
              [0-9a-f][0-9a-f]*)
                ;;
              *)
                echo "::error::could not resolve the commit behind $TAG (got '$sha')"
                exit 1
                ;;
            esac
            if [ "$sha" != "$GITHUB_SHA" ]; then
              echo "::error::$TAG points at $sha, but this run built $GITHUB_SHA"
              exit 1
            fi
            echo "$TAG exists and points at this commit"
            gh release create "$TAG" \
              --verify-tag \
              --title "BozKhar $version" \
              --generate-notes \
              "bozkhar-$version.zip" \
              "bozkhar-$version.zip.sha256" \
              "bozkhar-latest.zip" \
              "bozkhar-firefox-$version.zip" \
              "bozkhar-firefox-$version.zip.sha256" \
              "bozkhar-$version-source.zip" \
              "bozkhar-$version-source.zip.sha256"
          else
            echo "$TAG does not exist yet - creating it at $GITHUB_SHA"
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "BozKhar $version" \
              --generate-notes \
              "bozkhar-$version.zip" \
              "bozkhar-$version.zip.sha256" \
              "bozkhar-latest.zip" \
              "bozkhar-firefox-$version.zip" \
              "bozkhar-firefox-$version.zip.sha256" \
              "bozkhar-$version-source.zip" \
              "bozkhar-$version-source.zip.sha256"
          fi
