# Release: a `v*` tag (or a manual run naming an existing one) publishes a
# GitHub Release carrying the store zip, its SHA-256 and a provenance
# attestation.
#
# The build is cut from the tagged commit by the same gates CI runs, never
# from a workstation, and the tag must equal package.json's version - so
# "what was reviewed" and "what was uploaded" cannot drift apart.
#
# Cutting a release (human steps; CI only reacts to the tag):
#   git tag -a v0.4.0 -m "BozKhar 0.4.0"
#   git push origin v0.4.0
#
# See agent/PUBLISHING.md for what to do with the zip afterwards.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release (e.g. v0.4.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    name: verify, package, publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the release
      id-token: write # signs the provenance attestation
      attestations: write # stores it
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install (lockfile only)
        run: npm ci
      - name: Read the version
        id: pkg
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"
      - name: Match the tag to the version
        run: |
          set -euo pipefail
          version="$(jq -r .version package.json)"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match package.json version v$version"
            exit 1
          fi
      - name: Gate the tagged commit
        run: npm run verify
      - name: Build
        run: npm run build
      - name: Audit the built manifest
        run: npm run audit:dist
      - name: Package the store zip
        # scripts/package-store-zip.py writes bozkhar-<version>.zip (the
        # stores want manifest.json at the archive root - the script
        # asserts that after writing) plus its .sha256 sidecar.
        run: python3 scripts/package-store-zip.py
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: bozkhar-${{ steps.pkg.outputs.version }}.zip
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(jq -r .version package.json)"
          gh release create "$TAG" \
            --verify-tag \
            --title "BozKhar $version" \
            --generate-notes \
            "bozkhar-$version.zip" \
            "bozkhar-$version.zip.sha256"
