<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BozKhar</title>
    <link rel="icon" type="image/png" href="/icons/icon-48.png" />
    <link rel="stylesheet" href="./options.css" />
  </head>
  <body>
    <main class="page" id="app">
      <header class="page-header">
        <img class="brand-icon" src="/icons/icon-128.png" alt="" width="56" height="56" />
        <h1 class="title" data-i18n="optionsTitle"></h1>
        <p class="privacy" data-i18n="privacyNote"></p>
      </header>

      <section class="card" aria-labelledby="h-language">
        <h2 class="card-title" id="h-language" data-i18n="uiLanguage"></h2>
        <div class="segmented" role="radiogroup" aria-label="UI language">
          <button type="button" class="segment" id="lang-fa">فارسی</button>
          <button type="button" class="segment" id="lang-en">English</button>
        </div>
      </section>

      <section class="card" aria-labelledby="h-plus">
        <h2 class="card-title" id="h-plus" data-i18n="hasPlus"></h2>
        <p class="hint" data-i18n="hasPlusHint"></p>
        <label class="switch">
          <input type="checkbox" id="hasPlus" />
          <span class="slider"></span>
        </label>
      </section>

      <section class="card" aria-labelledby="h-tolerance">
        <h2 class="card-title" id="h-tolerance" data-i18n="tolerancePercent"></h2>
        <p class="hint" data-i18n="toleranceHint"></p>
        <div class="range-row">
          <input type="range" id="tolerancePercent" min="0" max="10" step="0.5" />
          <output id="toleranceOut" for="tolerancePercent">2%</output>
        </div>
      </section>

      <section class="card" aria-labelledby="h-crawl">
        <h2 class="card-title" id="h-crawl" data-i18n="crawlDelayMs"></h2>
        <p class="hint" data-i18n="crawlDelayHint"></p>
        <input type="number" id="crawlDelayMs" min="0" max="60000" step="250" />
      </section>

      <section class="card" aria-labelledby="h-stale">
        <h2 class="card-title" id="h-stale" data-i18n="stalenessWarnHours"></h2>
        <p class="hint" data-i18n="stalenessHint"></p>
        <input type="number" id="stalenessWarnHours" min="1" max="720" step="1" />
      </section>

      <section class="card" aria-labelledby="h-insights">
        <h2 class="card-title" id="h-insights" data-i18n="openInsights"></h2>
        <p class="hint" data-i18n="openInsightsHint"></p>
        <div class="actions">
          <button type="button" class="btn" id="openInsightsBtn" data-i18n="openInsights"></button>
        </div>
      </section>

      <section class="card" aria-labelledby="h-data">
        <h2 class="card-title" id="h-data" data-i18n="exportData"></h2>
        <p class="hint" data-i18n="exportHint"></p>
        <div class="actions">
          <button type="button" class="btn" id="exportBtn" data-i18n="exportData"></button>
          <button type="button" class="btn danger" id="clearBtn" data-i18n="clearAll"></button>
        </div>
        <p class="meta">
          <span data-i18n="extractorVersionLabel"></span>
          <code id="extractorVersion">-</code>
        </p>
      </section>

      <p class="toast" id="toast" role="status" aria-live="polite" hidden></p>
    </main>
    <script type="module" src="./options.ts"></script>
  </body>
</html>
