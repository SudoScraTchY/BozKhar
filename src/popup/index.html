<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BozKhar</title>
    <link rel="icon" type="image/png" href="/icons/icon-48.png" />
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main class="popup" id="app">
      <header class="popup-header">
        <img class="brand-icon" src="/icons/icon-128.png" alt="" width="48" height="48" />
        <div class="header-copy">
          <h1 class="title" data-i18n="popupTitle"></h1>
          <p class="privacy" data-i18n="popupPrivacy"></p>
        </div>
        <a
          class="github-star"
          id="githubLink"
          href="https://github.com/SudoScraTchY/BozKhar"
          target="_blank"
          rel="noreferrer noopener"
          aria-label="GitHub"
          data-i18n-title="popupStarGithub"
        >
          <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" focusable="false">
            <path
              d="M8 1.6l1.84 3.73 4.12.6-2.98 2.9.7 4.1L8 11.1l-3.68 1.94.7-4.1-2.98-2.9 4.12-.6z"
              fill="none"
              stroke="currentColor"
              stroke-width="1.2"
              stroke-linejoin="round"
            />
          </svg>
        </a>
      </header>

      <section class="stats" aria-label="summary">
        <div class="stat">
          <span class="stat-label" data-i18n="popupOrders"></span>
          <strong class="stat-value" id="ordersValue">—</strong>
        </div>
        <div class="stat">
          <span class="stat-label" data-i18n="popupNetPaid"></span>
          <strong class="stat-value" id="paidValue">—</strong>
        </div>
      </section>
      <p class="meta" id="syncLine"></p>

      <nav class="actions">
        <button type="button" class="action primary" id="insightsBtn">
          <span class="action-title" data-i18n="popupInsights"></span>
          <span class="action-hint" data-i18n="popupInsightsHint"></span>
        </button>
        <button type="button" class="action" id="resultsBtn">
          <span class="action-title" data-i18n="popupResults"></span>
          <span class="action-hint" data-i18n="popupResultsHint"></span>
        </button>
        <button type="button" class="action" id="settingsBtn">
          <span class="action-title" data-i18n="popupSettings"></span>
          <span class="action-hint" data-i18n="popupSettingsHint"></span>
        </button>
        <button type="button" class="action quiet" id="ordersBtn">
          <span class="action-title" data-i18n="popupOpenOrders"></span>
        </button>
      </nav>

      <footer class="footer">
        <span>BozKhar</span>
        <span class="footer-meta">
          <a
            class="update-pill"
            id="updateLink"
            href="https://github.com/SudoScraTchY/BozKhar/releases/latest"
            target="_blank"
            rel="noreferrer noopener"
            hidden
          ></a>
          <span id="version">v—</span>
        </span>
      </footer>
    </main>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
